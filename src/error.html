<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% — sheaf</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: #ffffff;
				color: #2f3437;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				line-height: 1.6;
			}
			main {
				display: flex;
				flex-direction: column;
				justify-content: center;
				min-height: 100vh;
				max-width: 56rem;
				margin: 0 auto;
				padding: 6rem 1.5rem;
			}
			.brand,
			h1 {
				font-family: Georgia, serif;
				color: #111111;
			}
			.brand {
				margin: 0;
				font-size: 1.5rem;
			}
			.status {
				margin: 2.5rem 0 0;
				font-size: 0.875rem;
				letter-spacing: 0.2em;
				color: #787774;
				font-variant-numeric: tabular-nums;
			}
			h1 {
				margin: 1rem 0 0;
				font-size: 2.5rem;
				line-height: 1.1;
				letter-spacing: -0.03em;
			}
			p.body {
				margin: 1.5rem 0 0;
				max-width: 36rem;
				font-size: 1rem;
			}
			a {
				margin-top: 2.5rem;
				align-self: flex-start;
				border: 1px solid #eaeaea;
				border-radius: 0.375rem;
				background: #ffffff;
				padding: 0.75rem 1.5rem;
				font-size: 0.875rem;
				font-weight: 500;
				color: #111111;
				text-decoration: none;
			}
			a:hover {
				background: #f7f6f3;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="brand">sheaf</p>
			<p class="status">%sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<p class="body">Please try again. If the problem persists, check back shortly.</p>
			<a href="/">Back to home</a>
		</main>
	</body>
</html>
