name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate Worker types
        run: npm run gen
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Regression checks
        run: |
          set -e
          for check in scripts/*.check.mjs; do
            node "$check"
          done
      - name: Build
        run: npm run build
      # Wrangler includes the Worker entrypoint in declarations after the first build.
      - name: Validate post-build Worker types
        run: |
          npm run gen
          npm run check
          npm run lint
      - name: Security audit
        run: npm audit --include=dev --audit-level=high
