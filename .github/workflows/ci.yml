name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Worker types
        run: npm run gen
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Regression checks
        run: npm run check:regression
      - name: Build
        run: npm run build
      # Wrangler includes the Worker entrypoint in declarations after the first build.
      - name: Validate post-build Worker types
        run: |
          npm run gen
          npm run check
          npm run lint
      - name: Security audit
        run: npm audit --include=dev --audit-level=high
      - name: CI summary
        if: always()
        run: |
          {
            echo '## CI summary'
            echo
            echo '- Generate Worker types: npm run gen'
            echo '- Lint: npm run lint'
            echo '- Type check: npm run check'
            echo '- Regression checks: npm run check:regression'
            echo '- Build: npm run build'
            echo '- Security audit: npm audit --include=dev --audit-level=high'
          } >> "$GITHUB_STEP_SUMMARY"
